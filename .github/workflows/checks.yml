name: Public package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check custom_components/switchbot_frame_control/frontend/frame-upload-card.js
      - run: node tests/test_card_memory.cjs
      - run: node tests/test_card_preparation.cjs
      - run: python tools/check_public.py
      - run: python tools/build_release.py
