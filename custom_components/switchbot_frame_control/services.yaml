set_layout:
  name: Set saved frame layout
  description: Save this frame's orientation and 180-degree correction without sending or selecting artwork.
  fields:
    frame_id:
      required: true
      selector:
        text:
    orientation:
      required: true
      selector:
        select:
          options:
            - landscape
            - portrait
    flipped:
      required: true
      selector:
        boolean:
show_baby:
  name: Show baby asleep picture
  description: Show the configured notification picture using the selected connection mode.
  fields:
    frame_id:
      name: Frame
      description: Configured frame id. Required with multiple frames unless default_frame is set.
      example: main_frame
      selector:
        text:
restore_normal:
  name: Restore normal slideshow
  description: Restore the selected frame’s slideshow, excluding its tracked notification picture.
  fields:
    frame_id:
      name: Frame
      description: Configured frame id. Required with multiple frames unless default_frame is set.
      example: main_frame
      selector:
        text:
repair_connection:
  name: Reconnect frame after reset
  description: Use retained SwitchBot sign-in to refresh this frame’s Bluetooth key or Wi-Fi connection.
  fields:
    frame_id:
      name: Frame
      description: Configured frame id. Required with multiple frames unless default_frame is set.
      example: main_frame
      selector:
        text:

set_connection_mode:
  name: Set frame connection mode
  description: Choose Bluetooth only, prefer Bluetooth with Wi-Fi/cloud fallback, or Wi-Fi/cloud only for this frame.
  fields:
    frame_id:
      description: Configured destination frame id.
      example: small_frame
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options:
            - local
            - hybrid
            - wifi

select_image:
  name: Select stored picture
  description: Select an existing picture using this frame's saved connection mode.
  fields:
    frame_id:
      selector:
        text:
    index:
      required: true
      selector:
        number:
          min: 1
          max: 20480
reconcile_cloud_registration:
  name: Reconcile pending cloud registration
  description: Recover an existing registration by its uploaded filename. Only confirm rejection after checking the server response; this never deletes artwork.
  fields:
    frame_id:
      selector:
        text:
    confirm_rejected:
      default: false
      selector:
        boolean:
backup_current_picture:
  name: Back up current picture
  description: Save a private JPEG backup of the selected original-frame cloud picture without changing the frame. Download it from the dashboard.
  fields:
    frame_id:
      selector:
        text:

inspect_library:
  name: Inspect upload-first library
  description: Read capacity and delivery/cleanup status without changing artwork. Original 31.5-inch Wi-Fi profile only.
  fields:
    frame_id:
      required: true
      selector:
        text:

backup_library:
  name: Back up frame library
  description: Save verified private cloud originals in the HA gallery without deleting or selecting. Original 31.5-inch Wi-Fi profile only.
  fields:
    frame_id:
      required: true
      selector:
        text:

retry_library_cleanup:
  name: Retry previous-picture cleanup
  description: Resume durable backed-up cleanup; current selection and restore references stay protected. Original 31.5-inch Wi-Fi profile only.
  fields:
    frame_id:
      required: true
      selector:
        text:

resume_library_delivery:
  name: Resume registered library delivery
  description: Retry an existing uncertain delivery without registering a duplicate. Original 31.5-inch Wi-Fi profile only.
  fields:
    frame_id:
      required: true
      selector:
        text:

set_library_mode:
  name: Enable or disable upload-first library
  description: Explicit opt-in. Backs up available originals; subsequent successful sends archive and remove eligible previous pictures from frame and cloud. Existing collections are not purged. Original 31.5-inch Wi-Fi profile only. Read docs/LIBRARY.md first.
  fields:
    frame_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    retain_indices:
      description: Additional picture indices to retain. Normal playlist and notification/restore references are protected automatically.
      default: []
      selector:
        object:
    recover_index:
      description: Optional existing legacy registration to reconcile, not a new upload. Use only after inspecting the frame.
      selector:
        number:
          min: 1
          max: 255
